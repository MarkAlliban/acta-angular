<div class="level">
  <p class="mobile-level-name">
    <b>{{ level().name }}</b>
  </p>
  @for (ship of shipsSorted(); track ship.id) {
    <p>
      <a
        [href]="`/ship?edition=${edition()?.abbreviation}&ShipID=${ship.id}`"
        [class]="`ship-type-${ship.type}`"
        >{{ ship.name }}{{ isFighter(ship) ? ` (${ship.numberPerWing})` : null }}</a
      >
    </p>
  }
</div>
