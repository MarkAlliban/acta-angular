<div class="level">
  @if (ships().length) {
    <p class="mobile-level-name">
      <b>{{ level().name }}</b>
    </p>
  }
  @for (ship of ships(); track ship.id) {
    <p>
      <a
        routerLink="/ship"
        [queryParams]="{
          edition: edition()?.id,
          ShipID: isFighter(ship) ? allFighters() : ship.id,
        }"
        [class]="`ship-type-${ship.type}`"
        >{{ ship.name }}{{ isFighter(ship) ? ` (${ship.numberPerWing})` : null }}</a
      >
    </p>
  }
</div>
