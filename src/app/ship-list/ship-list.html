@if (!edition()) {
  <app-kosh
    [message]="`Invalid edition: ${shipService.editionName() || 'please choose an edition'}`"
  />
} @else if (!ships()?.length) {
  <app-kosh [message]="`No ships found for edition: ${edition()?.name}`" />
} @else {
  <div class="ship-list">
    @for (source of sources(); track source) {
      @if ($index === 0 || showSupplemental()) {
        <app-ship-source [source]="source" [isFirstSource]="$index === 0" />
      }
    }
    @if (!showSupplemental()) {
      <div class="supplemental-button-container">
        <button (click)="showSupplemental.set(true)">Show supplemental ships</button>
      </div>
    }
  </div>
}
