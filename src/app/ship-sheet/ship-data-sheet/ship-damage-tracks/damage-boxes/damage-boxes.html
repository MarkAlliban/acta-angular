<table class="damage-boxes-container">
  <colgroup>
    @for (row of [].constructor(10); track $index) {
      <col [style]="{ width: '10%'}" />
    }
  </colgroup>
  <tbody>
    @for (row of [].constructor(rows()); track $index; let rowIndex = $index) {
      <tr>
        @for (
          col of [].constructor($index === rows() - 1 ? lastRow() : 10);
          track $index;
          let colIndex = $index
        ) {
          <td
            [style]="
              boxes() - rowIndex * 10 - colIndex <= colored() ? { backgroundColor: color() } : {}
            "
          ></td>
        }
      </tr>
    }
  </tbody>
</table>
