<div class="ship-data-sheet">
  <div class="ship-data-sheet__header">
    @if (removeFromFleet()) {
      <button class="ship-close" (click)="removeFromFleet()" [style]="{ marginLeft: '0.2rem' }">
        x
      </button>
    }
    <p [style]="{ margin: 'auto' }">{{ race()?.name }} - {{ level()?.name }}</p>
  </div>
  <app-ship-name [numberOfShips]="numberOfShips()" />
  <div class="ship-data-sheet__header">
    <p [style]="{ margin: 'auto' }">{{ ship().name }}</p>
  </div>
  <app-ship-speed
    [numberOfShips]="numberOfShips()"
    [speed]="ship().speed"
    [troops]="ship().troops"
    [isSpaceStation]="isSpaceStation()"
    [isAncient]="isAncient()"
  />
  <app-ship-data-panel [ship]="ship()" [numberOfShips]="numberOfShips()" />
  <app-ship-damage-tracks
    [ship]="ship()"
    [race]="race()!"
    [numberOfShips]="numberOfShips()"
    [isSpaceStation]="isSpaceStation()"
		[isAncient]="isAncient()"
  />
  <div class="copyright subheading">
    All Content Copyright Mongoose Publishing 2009-2026. Reproduced with permission.
  </div>
</div>
