<div class="fighter-data-sheet">
  <div class="fighter-data-sheet__header">
    @if (showDelete()) {
      <button class="ship-close" (click)="removeFromFleet()"></button>
    }
    <p [style]="{ margin: 'auto' }">{{ race()?.name }} - {{ level()?.name }}</p>
  </div>
  <div class="fighter-data-sheet__header">
    {{ ship().name }}
  </div>
  <app-ship-data-panel [ship]="ship()" [race]="race()!" [numberOfShips]="1" [fighter]="true" />
</div>
